[package]
name = "hivekit-js"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "wasm-bindgen bindings for hivekit-core: hive-wasm-v1 manifests, addresses and .hbc packaging from JavaScript"
# Not published to crates.io: built by wasm-pack and shipped inside the npm package.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hivekit-core = { version = "1.0.0", path = "../hivekit-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
js-sys = "0.3"

[dev-dependencies]
hex = "0.4"
