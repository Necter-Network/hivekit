[package]
name = "hivekit-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Python bindings (module `hivekit_core`) for hivekit-core: hive-wasm-v1 manifests, addresses and .hbc packaging"
# Not published to crates.io: built by maturin and shipped as the `hivekit-core` wheel.
publish = false

[lib]
# Python imports this as `hivekit_core` (distinct from the pure-Python `hivekit` SDK).
name = "hivekit_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Aliased: the cdylib itself is named `hivekit_core`.
hk = { package = "hivekit-core", version = "1.0.0", path = "../hivekit-core" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
serde_json = "1.0"

[build-dependencies]
pyo3-build-config = "0.29"

[features]
# maturin enables this when building a wheel (see pyproject.toml); plain
# `cargo build` / `cargo test` link against libpython instead.
extension-module = ["pyo3/extension-module"]
