[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "necter-hivekit"
version = "1.0.0"
description = "HiveKit: build hive-wasm-v1 modules for the Necter network in Python"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Necter Network" }]
keywords = ["hivekit", "necter", "wasm", "ndsr"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "click>=8.0",
    "pycryptodome>=3.10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Necter-Network/hivekit"
Documentation = "https://necter.network/docs"

[project.scripts]
hivec = "hivekit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hivekit"]
artifacts = ["hivekit/runtime/*.wasm"]

[tool.hatch.build.targets.sdist]
exclude = ["runtime-py/target", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
