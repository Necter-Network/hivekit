[workspace]
members = [".", "hivekit-macro"]
resolver = "2"

[package]
name = "hivekit"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "HiveKit Rust SDK: write hive-wasm-v1 modules for the Necter network (NDSR) and package them with hivec"
license = "Apache-2.0"
repository = "https://github.com/Necter-Network/hivekit"
homepage = "https://necter.network"
documentation = "https://necter.network/docs"
readme = "README.md"
keywords = ["hivekit", "necter", "wasm", "ndsr", "sdk"]
categories = ["wasm", "development-tools"]
exclude = ["target/", "dist/", "examples/*.wasm"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "hivec"
path = "src/bin/hivec.rs"

# Examples are real modules: `hivec build --example <name>` compiles them to
# wasm32-unknown-unknown and packages a .hbc.
[[example]]
name = "math_module"
crate-type = ["cdylib"]

[[example]]
name = "counter"
crate-type = ["cdylib"]

[[example]]
name = "price_oracle"
crate-type = ["cdylib"]

[dependencies]
hivekit-macro = { version = "1.0.0", path = "hivekit-macro" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Native only: the mock host's keccak and the hivec CLI.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
hivekit-core = { version = "1.0.0", path = "../hivekit-core/crates/hivekit-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
