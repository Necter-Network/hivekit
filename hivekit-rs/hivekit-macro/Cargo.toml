[package]
name = "hivekit-macro"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Procedural macros for the HiveKit Rust SDK (#[hive_export], hive_module!)"
license = "Apache-2.0"
repository = "https://github.com/Necter-Network/hivekit"
homepage = "https://necter.network"
documentation = "https://necter.network/docs"
keywords = ["hivekit", "necter", "wasm", "macros"]
categories = ["wasm", "development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
