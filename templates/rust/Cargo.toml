[package]
name = "__NAME__"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]   # rlib lets `cargo test` use the module natively

[dependencies]
hivekit = { git = "https://github.com/Necter-Network/hivekit", tag = "v1.0.0" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
